<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Naval Mine Symbol -->
    <g id="mine-icon">
      <circle cx="0" cy="0" r="28" fill="#546e7a"/>
      <!-- Spikes -->
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
      <line x1="-30" y1="30" x2="30" y2="-30" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
      <!-- Small bolts on circle -->
      <circle cx="-12" cy="-12" r="4" fill="#90a4ae"/>
      <circle cx="12" cy="-12" r="4" fill="#90a4ae"/>
      <circle cx="0" cy="14" r="4" fill="#90a4ae"/>
      <circle cx="0" cy="0" r="8" fill="#37474f"/>
    </g>
  </defs>

  <!-- Clean Light Studio Background -->
  <rect width="1200" height="675" fill="#f4f7f9"/>

  <!-- Floating Mines in Background (Soft gray) -->
  <use href="#mine-icon" x="150" y="140" transform="scale(0.8)" opacity="0.3"/>
  <use href="#mine-icon" x="1050" y="160" transform="scale(0.9)" opacity="0.35"/>
  <use href="#mine-icon" x="220" y="480" transform="scale(1.1)" opacity="0.25"/>
  <use href="#mine-icon" x="960" y="500" transform="scale(0.85)" opacity="0.3"/>
  <use href="#mine-icon" x="80" y="320" transform="scale(0.65)" opacity="0.2"/>
  <use href="#mine-icon" x="1120" y="350" transform="scale(0.7)" opacity="0.25"/>
  <use href="#mine-icon" x="500" y="90" transform="scale(0.5)" opacity="0.2"/>
  <use href="#mine-icon" x="720" y="110" transform="scale(0.6)" opacity="0.2"/>

  <!-- Desktop App Window Center -->
  <g transform="translate(600, 310)">
    <!-- Big Bold Modern Title -->
    <text x="0" y="0" font-family="'Orbitron', 'Montserrat', sans-serif" font-size="54" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="1">JavaMinesweeper</text>
    <text x="0" y="38" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3">OBJECT-ORIENTED PROGRAMMING IN JAVA</text>

    <!-- Play Game Button -->
    <g transform="translate(-100, 80)">
      <rect width="200" height="48" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
      <text x="100" y="30" font-family="'Space Mono', monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Play Game</text>
    </g>

    <!-- Difficulty Selectors -->
    <g transform="translate(0, 160)">
      <rect x="-135" y="-12" width="80" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="-95" y="6" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">EASY</text>

      <rect x="-40" y="-12" width="80" height="26" rx="4" fill="#3b82f6"/>
      <text x="0" y="6" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MEDIUM</text>

      <rect x="55" y="-12" width="80" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="95" y="6" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">HARD</text>
    </g>
  </g>
</svg>
