<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="retro-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffd54f" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Retro Terminal Background -->
  <rect width="1200" height="675" fill="#1b1414"/>

  <!-- Subtle Pixel Grid -->
  <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#251b1b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#pixel-grid)"/>

  <!-- Top App Window Bar -->
  <rect width="1200" height="34" fill="#110d0d" stroke="#2c2020" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="600" y="23" font-family="'Space Mono', monospace" font-size="12" fill="#7d6b6b" text-anchor="middle">cooking_quest.py - Python 3.11 [Running]</text>

  <!-- Center Pixel Art Game Banner -->
  <g transform="translate(600, 240)">
    <!-- Pixel Icons: Potion & Chef Hat -->
    <g transform="translate(-60, -90)">
      <!-- Pixel Potion Bottle -->
      <rect x="0" y="0" width="10" height="15" fill="#26a69a"/>
      <rect x="-8" y="15" width="26" height="30" rx="3" fill="#00bfa5"/>
      <rect x="-3" y="25" width="16" height="15" fill="#a7ffeb"/>
    </g>
    <g transform="translate(45, -90)">
      <!-- Pixel Chef Hat -->
      <rect x="0" y="20" width="36" height="12" fill="#eeeeee"/>
      <circle cx="6" cy="12" r="10" fill="#ffffff"/>
      <circle cx="18" cy="8" r="12" fill="#ffffff"/>
      <circle cx="30" cy="12" r="10" fill="#ffffff"/>
      <rect x="3" y="28" width="30" height="3" fill="#e53935"/>
    </g>

    <!-- Retro Title -->
    <text x="0" y="0" font-family="'Courier New', 'Space Mono', monospace" font-size="52" font-weight="900" fill="#ffca28" text-anchor="middle" letter-spacing="6" filter="url(#retro-glow)">COOKING QUEST</text>
    <text x="0" y="32" font-family="'Space Mono', monospace" font-size="14" fill="#a8927e" text-anchor="middle" letter-spacing="3">- PYTHON ACADEMIC PROJECT -</text>

    <!-- Start Game Button -->
    <g transform="translate(-110, 85)">
      <rect width="220" height="52" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
      <text x="110" y="33" font-family="'Space Mono', monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">START GAME</text>
    </g>

    <!-- Small UI Details -->
    <text x="0" y="195" font-family="'Space Mono', monospace" font-size="13" fill="#6d5a5a" text-anchor="middle">PRESS [SPACE] TO INTERACT • 2ND YEAR BSIT</text>
  </g>

  <!-- Bottom Taskbar -->
  <rect y="640" width="1200" height="35" fill="#110d0d"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#332424" stroke-width="1"/>
  <text x="30" y="662" font-family="'Space Mono', monospace" font-size="12" fill="#52ffb8">● Terminal: Ready</text>
  <text x="1150" y="662" font-family="'Space Mono', monospace" font-size="12" fill="#756464" text-anchor="end">FPS: 60</text>
</svg>
